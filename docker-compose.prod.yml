version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: e-parapheur-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - e-parapheur-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # NestJS Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.prod
    container_name: e-parapheur-backend-prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL}
      API_PORT: ${API_PORT}
      API_URL: ${API_URL}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e-parapheur-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
    container_name: e-parapheur-frontend-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${API_URL}/api
      VITE_ONLYOFFICE_URL: ${ONLYOFFICE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - e-parapheur-network
    depends_on:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # OnlyOffice Document Server
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: e-parapheur-onlyoffice-prod
    environment:
      POSTGRESQL_SERVER_HOST: postgres
      POSTGRESQL_SERVER_PORT: 5432
      POSTGRESQL_SERVER_DB_NAME: ${ONLYOFFICE_DB_NAME}
      POSTGRESQL_SERVER_DB_USER: ${ONLYOFFICE_DB_USER}
      POSTGRESQL_SERVER_DB_PASSWORD: ${ONLYOFFICE_DB_PASSWORD}
    ports:
      - "${ONLYOFFICE_PORT}:80"
    volumes:
      - onlyoffice_data_prod:/var/www/onlyoffice/Data
      - onlyoffice_logs_prod:/var/log/onlyoffice
    networks:
      - e-parapheur-network
    depends_on:
      - postgres
    restart: always

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: e-parapheur-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - e-parapheur-network
    restart: always
    command: redis-server --appendonly yes

networks:
  e-parapheur-network:
    driver: bridge

volumes:
  postgres_data_prod:
  onlyoffice_data_prod:
  onlyoffice_logs_prod:
  redis_data_prod:
