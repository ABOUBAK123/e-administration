name: CI and Deploy to dyula.ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dyula-main
  cancel-in-progress: true

jobs:
  build:
    name: Build (monorepo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all
        run: npm run build

  deploy:
    name: Deploy to dyula.ci
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DYULA_SSH_HOST }}
          username: ${{ secrets.DYULA_SSH_USER }}
          key: ${{ secrets.DYULA_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DYULA_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/var/www/html/e-administration"
            BRANCH="main"
            REPO_URL="https://github.com/ABOUBAK123/e-administration.git"

            if [ ! -d "${APP_DIR}/.git" ]; then
              sudo mkdir -p /var/www/html
              sudo git clone "${REPO_URL}" "${APP_DIR}"
              sudo chown -R "$USER":"$USER" "${APP_DIR}"
            fi

            cd "${APP_DIR}"

            git fetch --all --prune
            git reset --hard "origin/${BRANCH}"

            npm ci
            npm run backend:build
            npm run frontend:build

            if [ -f "apps/backend/.env" ]; then
              npm run migration:run || true
            fi

            if command -v pm2 >/dev/null 2>&1; then
              if [ -f "ecosystem.config.js" ]; then
                pm2 start ecosystem.config.js --update-env || pm2 restart all --update-env
              else
                pm2 restart all --update-env || true
              fi
              pm2 save || true
            else
              sudo npm install -g pm2
              pm2 start ecosystem.config.js
              pm2 save
            fi

            sudo systemctl reload apache2 || true
